<script>
/* ======================================================================
   ENGINE — layout helpers, SVG mechanism renderer
   ====================================================================== */
const ROLE_VAR = {
  nu: 'var(--nucleophile)', el: 'var(--electrophile)', rad: 'var(--radical)',
  lg: 'var(--leaving)', plain: 'currentColor', product: 'var(--heading)'
};

function fmt(label){
  // convert markup like C2^+ or O^- or H2O or N^.  into tspans (super/sub)
  // ^x = superscript, _x = subscript, use unicode already mostly; keep simple
  return String(label);
}

// Place n points evenly on a circle
function ringPoints(cx, cy, r, n, startAngle=-90){
  const pts=[];
  for(let i=0;i<n;i++){
    const a = (startAngle + i*(360/n)) * Math.PI/180;
    pts.push({x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)});
  }
  return pts;
}

// station(): builds an array of atom objects with computed positions from a compact spec
// spec: {id, x, y, layout: 'point'|'chain'|'vchain'|'zigzag'|'ring', spacing, r, entries:[{id,label,role,charge}], bondOrders:[1,2,...] between consecutive entries, closeRing:bool}
function station(spec){
  const atoms = [];
  const n = spec.entries.length;
  let pts = [];
  if(spec.layout === 'point'){
    pts = [{x: spec.x, y: spec.y}];
  } else if(spec.layout === 'chain'){
    const sp = spec.spacing || 46;
    for(let i=0;i<n;i++) pts.push({x: spec.x + i*sp, y: spec.y});
  } else if(spec.layout === 'vchain'){
    const sp = spec.spacing || 40;
    for(let i=0;i<n;i++) pts.push({x: spec.x, y: spec.y + i*sp});
  } else if(spec.layout === 'zigzag'){
    const sp = spec.spacing || 40;
    const amp = spec.amp || 20;
    for(let i=0;i<n;i++) pts.push({x: spec.x + i*sp, y: spec.y + (i%2===0?0:-amp)});
  } else if(spec.layout === 'ring'){
    pts = ringPoints(spec.x, spec.y, spec.r || 34, n, spec.startAngle);
  }
  spec.entries.forEach((e,i)=>{
    atoms.push({ id: e.id, x: pts[i].x + (e.dx||0), y: pts[i].y + (e.dy||0),
      label: e.label, role: e.role || 'plain', station: spec.id, sub: e.sub || null });
  });
  // auto bonds between consecutive entries
  const bonds = [];
  if(spec.layout !== 'point' && spec.autoBond !== false){
    for(let i=0;i<n-1;i++){
      const order = (spec.bondOrders && spec.bondOrders[i]) || 1;
      bonds.push({ id: spec.id+'_b'+i, a: spec.entries[i].id, b: spec.entries[i+1].id, order });
    }
    if(spec.closeRing){
      const order = (spec.bondOrders && spec.bondOrders[n-1]) || 1;
      bonds.push({ id: spec.id+'_bC', a: spec.entries[n-1].id, b: spec.entries[0].id, order });
    }
  }
  return { atoms, bonds };
}

function buildDiagram(diagramSpec){
  let atoms = [], bonds = [];
  (diagramSpec.stations||[]).forEach(s=>{
    const built = station(s);
    atoms = atoms.concat(built.atoms);
    bonds = bonds.concat(built.bonds);
  });
  (diagramSpec.freeAtoms||[]).forEach(a=> atoms.push(Object.assign({role:'plain', station:'_free'}, a)));
  (diagramSpec.extraBonds||[]).forEach(b=> bonds.push(Object.assign({order:1}, b)));
  return { atoms, bonds, labels: diagramSpec.labels||[], viewBox: diagramSpec.viewBox||'0 0 720 220' };
}

function atomById(atoms, id){ return atoms.find(a=>a.id===id); }

// Compute cumulative bond/charge state BEFORE a given step index (0-based; state before step 0 = initial)
function stateBefore(mech, stepIndex){
  const built = buildDiagram(mech.diagram);
  // Events are tagged with the 1-based Pfeil-number that causes them.
  // stateBefore(k) (k = 0-based UI step index) applies events from steps 1..k.
  let bonds = built.bonds.slice();
  let charges = {}; // atomId -> [sign,...]
  const events = mech.diagram.events || [];
  for(let s=1; s<=stepIndex; s++){
    events.filter(e=>e.step===s).forEach(e=>{
      if(e.type==='bondRemove'){ bonds = bonds.filter(b=>b.id!==e.id); }
      if(e.type==='bondAdd'){ bonds.push({id:e.id, a:e.a, b:e.b, order:e.order||1}); }
      if(e.type==='bondOrder'){ const b=bonds.find(x=>x.id===e.id); if(b) b.order=e.order; }
      if(e.type==='chargeAdd'){ (charges[e.atom] = charges[e.atom]||[]).push(e.sign); }
      if(e.type==='chargeRemove'){ if(charges[e.atom]) charges[e.atom].pop(); }
      if(e.type==='moveAtom'){ const a=atomById(built.atoms,e.atom); if(a){ a.x += e.dx||0; a.y += e.dy||0; } }
    });
  }
  return { atoms: built.atoms, bonds, charges, viewBox: built.viewBox, labels: built.labels };
}

function drawArrowPath(from, to, curveDir){
  const mx = (from.x+to.x)/2, my=(from.y+to.y)/2;
  const dx = to.x-from.x, dy = to.y-from.y;
  const len = Math.hypot(dx,dy) || 1;
  const nx = -dy/len, ny = dx/len;
  const bend = curveDir==null ? -Math.min(46, Math.max(26,len*0.4)) : curveDir;
  const cx = mx + nx*bend, cy = my + ny*bend;
  return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;
}

function svgDefs(){
  return `<defs>
    <marker id="arrHead" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--accent)"></path>
    </marker>
    <marker id="arrHeadGhost" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor" opacity="0.55"></path>
    </marker>
    <marker id="fishHook" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,3.5 L0,4.2 Z" fill="var(--accent)"></path>
    </marker>
  </defs>`;
}

function bondLine(a,b,order){
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const pad = 15; // shrink to atom label edge
  const ax=a.x+dx/len*pad, ay=a.y+dy/len*pad, bx=b.x-dx/len*pad, by=b.y-dy/len*pad;
  if(order===2){
    const off=3.2;
    return `<line x1="${(ax+nx*off).toFixed(1)}" y1="${(ay+ny*off).toFixed(1)}" x2="${(bx+nx*off).toFixed(1)}" y2="${(by+ny*off).toFixed(1)}" stroke="currentColor" stroke-width="1.6"/>`+
           `<line x1="${(ax-nx*off).toFixed(1)}" y1="${(ay-ny*off).toFixed(1)}" x2="${(bx-nx*off).toFixed(1)}" y2="${(by-ny*off).toFixed(1)}" stroke="currentColor" stroke-width="1.6"/>`;
  }
  return `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="currentColor" stroke-width="1.6"/>`;
}

function chargeBadge(atom, sign, idx){
  const r=8;
  const ox = atom.x + 15, oy = atom.y - 15 - idx*18;
  const fill = sign==='+' ? 'var(--electrophile)' : (sign==='-'?'var(--nucleophile)':'var(--radical)');
  return `<circle cx="${ox}" cy="${oy}" r="${r}" fill="${fill}" opacity="0.92"></circle>
          <text x="${ox}" y="${oy+3.6}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--bg-elevated)">${sign}</text>`;
}

function renderAtomLabel(atom){
  const color = ROLE_VAR[atom.role] || 'currentColor';
  let sub = '';
  if(atom.sub){ sub = `<tspan baseline-shift="sub" font-size="8">${atom.sub}</tspan>`; }
  return `<text x="${atom.x}" y="${atom.y+4.5}" text-anchor="middle" font-size="13.5" font-weight="700" fill="${color}" class="formula">${atom.label}${sub}</text>`;
}

// Render one step's SVG (state shown = stateBefore(stepIndex), arrows = that step's arrows)
function renderMechSVG(mech, stepIndex, showGhostArrows){
  const isResult = stepIndex >= mech.steps.length;
  const st = stateBefore(mech, Math.min(stepIndex, mech.steps.length));
  let svg = `<svg viewBox="${st.viewBox}" role="img" aria-label="${(mech.title||'').replace(/"/g,'')} — Diagrammstufe ${Math.min(stepIndex+1, mech.steps.length)} von ${mech.steps.length}">`;
  svg += svgDefs();
  // ghost bonds/arrows from earlier steps (faint), current step arrows highlighted
  if(showGhostArrows){
    for(let s=1; s<=stepIndex; s++){
      const step = mech.steps[s-1];
      if(!step) continue;
      (step.arrows||[]).forEach(ar=>{
        const from = atomById(st.atoms, ar.from);
        const to = atomById(st.atoms, ar.to);
        if(from && to){
          const path = drawArrowPath(from, to, ar.bend);
          svg += `<path d="${path}" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.22" marker-end="url(#${ar.kind==='fishhook'?'fishHook':'arrHeadGhost'})"></path>`;
        }
      });
    }
  }
  // bonds
  st.bonds.forEach(b=>{
    const a=atomById(st.atoms,b.a), c=atomById(st.atoms,b.b);
    if(a&&c) svg += bondLine(a,c,b.order);
  });
  // current step arrows (on top of bonds, drawn before atom labels so labels stay legible)
  if(!isResult){
    const step = mech.steps[stepIndex];
    (step.arrows||[]).forEach(ar=>{
      const from = atomById(st.atoms, ar.from);
      const to = atomById(st.atoms, ar.to);
      if(from && to){
        const path = drawArrowPath(from, to, ar.bend);
        const marker = ar.kind==='fishhook' ? 'fishHook' : 'arrHead';
        svg += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#${marker})"></path>`;
      }
    });
  }
  // atoms + charges
  st.atoms.forEach(a=>{
    svg += renderAtomLabel(a);
    const ch = st.charges[a.id];
    if(ch){ ch.forEach((sign,i)=> svg += chargeBadge(a, sign, i)); }
  });
  // free labels (species captions)
  st.labels.forEach(l=>{
    svg += `<text x="${l.x}" y="${l.y}" text-anchor="${l.anchor||'middle'}" font-size="${l.size||11}" fill="var(--text-muted)" font-style="italic">${l.text}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

  querverbindung:'Denselben Mechanismus zeigen Ficin (Feige) und Kiwi-Aktinidin — daher werden diese Früchte auch als Fleisch-Tenderizer benutzt und dürfen nicht in Gelatine-Desserts, weil sie das Gelatineprotein zerlegen. Bei Milchgerinnung ist der zugrundeliegende Enzymtyp anders (Chymosin = Aspartat-Protease), das Prinzip einer selektiven Spaltung eines Zielproteins (κ-Casein) ist aber vergleichbar.'

    { text:'Protonierung des Aldehyds durch HCl (aus dem sauren Milieu): Ein freies Elektronenpaar am Carbonyl-O nimmt ein Proton auf; die C=O wird zu einer stärker polarisierten C=OH⁺ → Aktivierung des Aldehyd-C als Elektrophil.',
      arrows:[{from:'O', to:'Hp', kind:'full'}], gm:['proto'] },
    { text:'Das Pyrrol-π-System ist elektronenreich, insbesondere an den α-Positionen (C2/C5). Das π-Elektronenpaar der C2–C3-Doppelbindung des Pyrrols greift den elektrophilen Carbonyl-C des protonierten Aldehyds nukleophil an — Bildung einer neuen C–C-Bindung.',
      arrows:[{from:'C2', to:'C', kind:'full'}], gm:['nu'] },
    { text:'Am angegriffenen Pyrrol-α-C (C2) entsteht sp³-Hybridisierung, der Aromat ist gebrochen; positive Ladung sitzt am Pyrrol-N (Wheland-Intermediat). Am Aldehyd-C ist die C=OH⁺ zu C–OH kollabiert.',

    { text:'Rearomatisierung: Base (H₂O, Cl⁻) deprotoniert das C2-H; die Elektronen der C–H-σ-Bindung wandern in den Ring — Pyrrol-Aromatizität wiederhergestellt. Zwischenprodukt: 2-(Hydroxymethylen)-Pyrrol-Addukt.',
      arrows:[], gm:['proto'] },
    { text:'Wasser-Abspaltung: Das freie Elektronenpaar am Pyrrol-N klappt in eine C=C-Doppelbindung hinaus (Bruch der Aromatizität); simultan wandert das π-Elektronenpaar der C=C-Ring-Bindung zum exocyclischen C; die C–OH verlässt als H₂O. Es entsteht ein 2-Methylenpyrrolenium-Kation, resonanzstabilisiert bis in die Dimethylaminogruppe des Benzolrings.',
      arrows:[{from:'C2', to:'C', kind:'full'}], gm:['lg'] },
    { text:'Das freie Elektronenpaar am N(CH₃)₂-Stickstoff des ehemaligen Aldehyd-Restes stabilisiert die positive Ladung mesomer über den Benzolring hinweg — es entsteht ein chinoider Ammoniumsalz-artiger Farbstoff mit ausgedehnter Konjugation vom Pyrrol-Ring durch die Methylenbrücke bis zur para-Dimethylamino-Gruppe. Genau diese Konjugation absorbiert im sichtbaren Bereich.',

  netto:'Pyrrol + p-Me₂N-C₆H₄-CHO + H⁺ → chinoider, resonanzstabilisierter Farbstoff (λmax 550–580 nm) + H₂O. Kreatinin/Kreatinin-Analytik: Kreatinin + Pikrat reagieren 1:1.',
  querverbindung:'Prolin selbst wird analog nachgewiesen — aber ohne Chloramin-T-Oxidationsschritt, weil Prolin keine 4-OH-Gruppe zur Aromatisierung braucht; die Oxidation liefert direkt das Pyrrol. Damit unterscheidet der Analytiker Prolin und Hydroxyprolin über die Vorbehandlung. Van-Urk-Reaktion (Mutterkornalkaloide, LSD-Nachweis) und der Kovács-Test für Indol in Bakteriologie beruhen auf demselben chinoiden Farbstoffprinzip.'
},
{
  id:'m17', num:17, teil:'D', blitz:true,
  title:'Edman-Abbau — PITC → PTC-Peptid → ATZ → PTH-Aminosäure',
  zusammenhang:'Phenylisothiocyanat (PITC, Ph–N=C=S) reagiert mit der freien N-terminalen α-Aminogruppe eines Peptids. Die eigentliche Kunst des Edman-Abbaus ist, dass nur die N-terminale Peptidbindung spaltet, alle inneren Peptidbindungen aber intakt bleiben — der Rest der Kette kann im nächsten Zyklus erneut abgebaut werden. Möglich ist das durch die intramolekulare Cyclisierung des N-terminalen Restes. Drei Schritte: 1) Kupplung (basisch, wasserfrei), 2) Cyclisierung (sauer, wasserfrei, TFA), 3) Umlagerung (wässrig-sauer).',

  steps:[
    { text:'[Schritt 1.1 – Kupplung] Das freie Elektronenpaar am N-terminalen α-N des Peptids (im basischen Milieu deprotoniert) greift den Zentral-C des N=C=S-Systems nukleophil an — nukleophile Addition an das mittlere C-Atom.',
      arrows:[{from:'Npep', to:'Ccentral', kind:'full'}], gm:['nu'] },
    { text:'[Schritt 1.2] Das π-Elektronenpaar der C=N-Bindung des PITC klappt auf den Phenyl-N um; Bildung einer PhN–H⁻-artigen Struktur; Prototropie: N nimmt das α-NH-H auf.',
      arrows:[{from:'Ccentral', to:'Nph', kind:'full'}], gm:['pi'] },
    { text:'[Schritt 1.3] Rearrangement zur stabilen Struktur: Am Zentral-C ist nun eine C=S-Doppelbindung (Thiocarbonyl) und zwei N-H-Bindungen; das C ist sp²-hybridisiert. Ergebnis: das Phenylthiocarbamoyl-Peptid (PTC-Peptid) — Ph–NH–C(=S)–NH–CH(R)–C(=O)–NH-Rest.',
      arrows:[], gm:['proto'] },
    { text:'[Schritt 2.1 – Cyclisierung, TFA] Protonierung: TFA protoniert den Carbonyl-O der ersten Peptidbindung. Das π-Elektronenpaar der C=O klappt auf den O um (er trägt jetzt formal H, wird zu C=OH⁺). Das C ist stärker elektrophil.',
      arrows:[{from:'Ocarbonyl', to:'Hp', kind:'full'}], gm:['proto'] },
    { text:'[Schritt 2.2] Der Schwefel im PTC-Rest greift intramolekular an: Ein freies Elektronenpaar am S wandert auf den elektrophilen Carbonyl-C der Peptidbindung — Bildung einer neuen C–S-σ-Bindung; 5-Ring-Übergang.',
      arrows:[{from:'Sc', to:'Ccarbonyl', kind:'full'}], gm:['nu'] },
    { text:'[Schritt 2.3] Zusammenbruch des tetraedrischen Intermediats: Das Elektronenpaar am C–OH (Carbonyl-Sauerstoff) wandert zurück; simultan bricht die C–N-σ-Bindung der Peptidbindung. Die Elektronen der C–N-Bindung gehen an den Peptid-N — dieser wird zur freien α-NH₂-Gruppe des nun N-1-gekürzten Restpeptids.',
      arrows:[{from:'Ocarbonyl', to:'Ccarbonyl', kind:'full'},{from:'Ccarbonyl', to:'Nrest', kind:'full'}], gm:['lg'] },
    { text:'[Schritt 2.4] Umgebauter Ring: 5-Ring mit S, C=O (ehemaliger Carbonyl-C), C-N(H)-Ph, N (ehemaliger α-N des Peptids), C (α-C mit Seitenkette R). Das ist das Anilinothiazolinon (ATZ). Bemerkenswert: die Peptidbindung ist gebrochen, aber die α-Aminosäure ist noch nicht in ihre stabile Form umgelagert — das folgt im nächsten Schritt.',
      arrows:[], gm:['lg'] },
    { text:'[Schritt 3.1 – Umlagerung, wässrig-sauer] Wasser-Angriff am elektrophilen Ring-C=N-Kohlenstoff: Freies Elektronenpaar am O des Wassers greift den C an; die C=N-π-Elektronen klappen auf den N um; sp³-Zwischenprodukt.',
      arrows:[{from:'Ow3', to:'Ccarbonyl', kind:'full'}], gm:['nu'] },
    { text:'[Schritt 3.2] Ringöffnung: Elektronen der C–S-σ-Bindung wandern auf den S; C=N bildet sich neu; das S trägt jetzt eine freie SH-Gruppe. Es liegt ein offenkettiges α-Anilino-α-thio-Carbonyl-Intermediat vor.',
      arrows:[{from:'Ccarbonyl', to:'Sc', kind:'full'}], gm:['lg'] },
    { text:'[Schritt 3.3] Ringschluss neu: Das freie Elektronenpaar am S greift jetzt den Carbonyl-C (ehemaliger α-C) an; die C=O klappt auf O um; tetraedrisches Intermediat.',
      arrows:[{from:'Sc', to:'Ccarbonyl', kind:'full'}], gm:['nu'] },
    { text:'[Schritt 3.4] Kollaps: Das Alkoxid am O verlässt als OH⁻ (nach Protonierung als H₂O); der 5-Ring bildet sich als Phenylthiohydantoin — N–C(=S)–N–C(=O)–CH(R). Der Thiocarbonyl und der Carbonyl sind jetzt an verschiedenen Positionen als im ATZ — das ist der Isomerisierungsschritt.',
      arrows:[{from:'Ocarbonyl', to:'Ccarbonyl', kind:'full'}], gm:['pi'] }
  ],
  netto:'PITC + Peptid-α-NH₂ → PTC-Peptid → (TFA) → ATZ + verkürztes Restpeptid → (H₂O/HCl) → PTH-Aminosäure. Das PTH-Derivat ist stabil, farbig, chromatographisch identifizierbar; die Seitenkette R zeigt an, welche Aminosäure am N-Terminus stand. Ausbeute je Zyklus ca. 98 %; nach 70 Zyklen bleiben 0,98⁷⁰ ≈ 24 % Sequenzsignal — die praktische Zyklengrenze. Sanger-Reagenz (DNFB) markiert den N-Terminus nur einmal, weil die saure Hydrolyse alle Peptidbindungen spaltet; Edman lässt die Kette intakt und ermöglicht 50–70 Zyklen.',
  querverbindung:'Dieselbe Isothiocyanat-Chemie taucht auf bei Sinigrin/Sinalbin (Senföle in Kohl und Senf) — dort spaltet Myrosinase Glucosinolat zu Isothiocyanat, das mit Amin- oder Thiolgruppen im Körper reagiert. Verwandt: DABITC (Dimethylaminoazobenzol-isothiocyanat) — dieselbe Reaktion, nur mit chromogener Gruppe für hochempfindliche PTH-Detektion.'
},

  netto:'R–NH₂ + N₂O₃ → R–N₂⁺ (Alkyldiazonium) → R⁺ + N₂. Aromatische primäre Amine (Anilin und Derivate) liefern hingegen stabile Aryldiazoniumsalze — Basis der Azofarbstoffchemie. Merksatz: Sekundäre Amine geben stabile Nitrosamine (Gefahr im Fleisch), primäre Amine geben instabile Diazoniumsalze (schnell weg).',
  querverbindung:'Diese Diazonium-Chemie ist die Grundlage der Griess-Reaktion (Nitrit-Bestimmung in Trinkwasser, Wurst, Pökellake): Nitrit + Sulfanilamid → Aryldiazoniumsalz → Kupplung mit Naphthyl-Aminen (NED) → roter Azofarbstoff, photometrisch messbar. Verwandt: Sanger-Reagenz (Aryldiazonium → aromatische Substitution) sowie Farbreaktionen mit Sulfonamiden.'

{

  title:'Strecker-Abbau: α-Aminosäure + α-Dicarbonyl → Strecker-Aldehyd + Aminoketon + CO₂',

  steps:[
    { text:'Das freie Elektronenpaar am α-Aminostickstoff der Aminosäure greift den elektrophilen Carbonyl-C des α-Dicarbonyls (das reaktivere der beiden Carbonyle — beim Methylglyoxal das CHO, bei 1,2-Diketonen das sterisch zugängliche) nukleophil an.',
      arrows:[{from:'Naa', to:'Cdic', kind:'full'}], gm:['nu'] },
    { text:'Das π-Elektronenpaar der C=O klappt auf O um; tetraedrisches Halbaminal (Carbinolamin) mit sp³-C. Prototropie: H von N auf O.',
      arrows:[{from:'Cdic', to:'Odic', kind:'full'}], gm:['pi','proto'] },
    { text:'Wasser-Abspaltung: Das freie Elektronenpaar am N klappt in eine C=N-π-Bindung; das π-Elektronenpaar der C–OH wandert mit dem O als H₂O ab. Es entsteht die Schiff-Base (Azomethin) der Aminosäure mit dem α-Dicarbonyl.',
      arrows:[{from:'Naa', to:'Cdic', kind:'full'}], gm:['lg'] },
    { text:'Decarboxylierung — der eigentliche Strecker-Schritt: Die C–C-σ-Bindung zwischen α-C und COOH-C der Aminosäure bricht. Die Elektronen dieser Bindung wandern in eine C=C-π-Bindung zum Schiff-Base-Kohlenstoff (Delokalisation in das C=N-System hinein); simultan verlassen die Carboxylat-Elektronen als CO₂. Das α-C ist jetzt sp²-hybridisiert.',

      arrows:[{from:'Calpha', to:'Base', kind:'full'}], gm:['proto','pi'] },
    { text:'Hydrolyse: Wasser greift den Iminium-C (den ehemaligen α-C des Amins, jetzt Aminosäureseitenkette-tragend) an; π-Elektronen der C=N klappen auf N um; sp³-Zwischenprodukt mit Halbaminal.',
      arrows:[{from:'Ow', to:'Cdic', kind:'full'}], gm:['nu'] },
    { text:'Rückspaltung: N-Elektronenpaar wandert zurück; C–N-σ-Bindung bricht; die Elektronen bleiben am N (Aminoketon-Produkt). Am ehemaligen α-C sitzt eine Carbonylgruppe → das ist der Strecker-Aldehyd R–CHO mit einem C-Atom weniger als die Ausgangsaminosäure (die COOH ist als CO₂ weg).',
      arrows:[{from:'Cdic', to:'Naa', kind:'full'}], gm:['lg'] },
    { text:'Am Dicarbonyl-Rest sitzt jetzt ein α-Aminoketon — der zweite Reaktionspartner für die Pyrazin-Bildung: Zwei α-Aminoketone kondensieren zum Dihydropyrazin, das durch Luftoxidation zum Pyrazin aromatisiert. Das ist der Braten-/Röstgeruch von Kaffee, Kakao, Malz und gebratenem Fleisch.',
      arrows:[], gm:['redox'] }
  ],
  netto:'α-Aminosäure + α-Dicarbonyl → Strecker-Aldehyd (R-CHO, ein C weniger als die Aminosäure) + α-Aminoketon + CO₂.',
  querverbindung:'Aromatische Konsequenzen im Fleisch-Kontext: Phenylalanin → Phenylacetaldehyd (blumig, honigartig). Methionin → Methional (gekochte Kartoffel, Bratensauce). Cystein → Merkaptoacetaldehyd → weiter zu Thiazolinen und Thiophenen (schwefelige Röstnoten). Leucin → 3-Methylbutanal (malzig). Der Kakao- und Kaffee-Kontext ist chemisch identisch; nur die Auswahl der Ausgangsaminosäuren und die Rösttemperatur differieren.'
},
{

  zusammenhang:'2-Methyl-3-furanthiol (2M3F) hat einen Geruchsschwellenwert im ppb-Bereich; es ist das dominierende Aromamolekül der Bratensauce und der Rindfleischnote. Es entsteht aus Ribose (aus dem IMP-Abbau!) und einer Schwefelquelle (Cystein, GSH, Thiamin). Die Ribose kommt genau aus dem postmortalen Nucleotid-Abbau — deshalb schmeckt gereiftes Fleisch aromatischer als frisches.',

  steps:[
    { text:'Ribose isomerisiert im Sauren zur Ribulose (Amadori-artige Isomerisierung — Protonentransfer zwischen C1 und C2 mit Endiol-Zwischenstufe). Dehydrierung an C3/C4 unter Wasserabspaltung liefert eine α,β-ungesättigte 4-Hydroxy-5-methyl-3-furanon-Zwischenstufe (Norfuraneol-artig).',

    { text:'Wasser-Abspaltung an C4: Das freie Elektronenpaar am Ring-O klappt in eine C=C-π-Bindung; die C–OH-σ-Bindung an C4 verlässt als H₂O; Aromatisierung des 5-Ring-Furans.',
      arrows:[], gm:['lg'] },
    { text:'Cystein wird über den Strecker-Abbau zu Mercaptoacetaldehyd degradiert; alternativ liefert Thiamin über seine C2-S-C1′-Position ein H₂S-Äquivalent. Freies H₂S ist die eigentliche Schwefelquelle.',

    { text:'Der Schwefel greift am elektrophilen C3 des 4-Hydroxy-5-methyl-3(2H)-furanons nukleophil an: Das freie Elektronenpaar am S schlägt auf den Michael-Akzeptor-C3; π-Elektronen wandern zum C4-O.',

    { text:'Prototropie und Aromatisierung: Wasser-Abspaltung am C4 (die C4-OH verlässt); Elektronen reorganisieren sich zum vollaromatischen Furan-Ring mit exocyclischer SH-Gruppe an C3 und Methylgruppe an C2 → 2-Methyl-3-furanthiol.',
      arrows:[{from:'C4', to:'Ohsub', kind:'full'}], gm:['lg'] }
  ],
  netto:'Ribose + H₂S → [Dehydratisierung zu Norfuraneol-artiger Zwischenstufe] → Michael-Addition von H₂S → Wasserabspaltung/Aromatisierung → 2-Methyl-3-furanthiol.',
  querverbindung:'Analog entstehen 2-Furfurylthiol (Kaffee-Aroma) aus Furfural + H₂S und viele weitere Furanthiole. Die Chemie ist immer dieselbe Michael-Addition eines Schwefels an ein aktives Furanon.'
},

{
  id:'m28', num:28, teil:'H', blitz:false,
  title:'Homolytische β-O-4-Spaltung im Lignin',
  zusammenhang:'Lignin ist ein amorphes Polymer aus Coniferyl-, Sinapyl- und p-Cumarylalkohol, verknüpft über die häufige β-O-4-Bindung (β-Kohlenstoff der Seitenkette — 4-Ethersauerstoff des nächsten Rings). Bei der Pyrolyse (Glimm-, Reibrauch bei 200–500 °C) brechen diese Bindungen homolytisch — Radikalkette, aus der die Rauchphenole (Guajacol, Syringol, Kreosol, Vanillin) entstehen.',

  steps:[
    { text:'Thermische Homolyse: Die β-C–O-σ-Bindung bricht in zwei Radikale — je ein Elektron auf jeder Seite. Am β-C bleibt ein Kohlenstoffradikal (mesomer stabilisiert durch die α-Hydroxymethyl-Gruppe); am O bleibt ein Phenoxy-Radikal (mesomer stabilisiert über den Aromaten).',
      arrows:[{from:'Cb', to:'Oar', kind:'fishhook'}], gm:['redox'] },
    { text:'Das Kohlenstoff-Radikal (an der Seitenkette) β-eliminiert das α-H: Ein Fischhaken-Elektron aus der α-C–H-Bindung wandert zum β-C und komplettiert dort eine C=C-π-Bindung; das andere Elektron verbleibt am α-C als neues Radikal. Es entsteht ein Vinylether/Alken-Fragment.',

    { text:'Phenoxy-Radikal wird durch Wasserstoffabstraktion (aus anderen Ligninbindungen) zum stabilen Phenol reduziert → Guajacol (2-Methoxyphenol), Syringol (2,6-Dimethoxyphenol), Vanillin (aus Coniferyl-Grundgerüst, wenn die Seitenkette zum Aldehyd oxidiert wird).',
      arrows:[{from:'Har', to:'Oar', kind:'fishhook'}], gm:['redox'] },
    { text:'Bei höherer Temperatur (>400 °C) kondensieren Alkenfragmente und Aromaten über Diels-Alder-artige und radikalische Zyklisierungen zu polyzyklischen aromatischen Kohlenwasserstoffen (PAK) — Benzo[a]pyren als Leitsubstanz. PAK sind kanzerogen; Grenzwerte in Räucherwaren sind gesetzlich geregelt.',
      arrows:[], gm:['redox'] }
  ],
  netto:'Lignin-β-O-4-Einheit → homolytische Spaltung → Phenoxy-Radikal + Kohlenstoffradikal → Guajacol/Syringol/Vanillin (nach H-Abstraktion). Bei hoher Temperatur zusätzlich PAK-Bildung.',
  querverbindung:'Guajacol, Vanillin, Eugenol, 4-Vinylguajacol sind identische Verbindungen im Rauchtee (Lapsang Souchong), im getoasteten Barrique-Fass (Wein), im Räucherkäse und im Räucherfisch. Die Vanillin-Note im Rotwein aus dem Fass beruht auf derselben Chemie wie das Bratenaroma im Räucherschinken.'
},

<script>
/* ======================================================================
   APP — navigation, rendering, theme toggle
   ====================================================================== */
const TEIL_TITLES = {
  A: 'Post-mortem-Prozesse',
  B: 'Bindegewebe: Kollagen-Aufbau und -Alterung',
  C: 'Bindegewebe-Analytik: Hydroxyprolin-Nachweis (BEFFE)',
  D: 'Sequenzanalytik: Edman-Abbau',
  E: 'Fleischfarbe: Autoxidation und Umrötung',
  F: 'Pökeln-Nebenreaktionen: Nitrosamin-Bildung',
  G: 'Fleischaroma: Strecker-Abbau und Furanthiole',
  H: 'Räuchern: Lignin-Pyrolyse',
  I: 'Würzen: Prozesskontaminanten (3-MCPD und Glycidyl-Ester)',
  J: 'Rohwurst-Reifung: Glucono-δ-lacton und Nitratreduktion'
};
const TEIL_ORDER = ['A','B','C','D','E','F','G','H','I','J'];

let state = { activeId: null, step: 0, blitzOnly: false };

function teilGroups(){
  const groups = {};
  MECHANISMS.forEach(m=>{ (groups[m.teil]=groups[m.teil]||[]).push(m); });
  return groups;
}

function renderSidebar(){
  const groups = teilGroups();
  let html = `<div class="sidebar-intro">32 Mechanismen · jeder Pfeil einzeln. Klicke einen Mechanismus oder nutze den Filter für die zehn „Glomb-Blitz“-Pflichtmechanismen.</div>`;
  html += `<div class="filter-row">
    <button class="filter-chip" id="chipAll" aria-pressed="${!state.blitzOnly}">Alle 32</button>
    <button class="filter-chip" id="chipBlitz" aria-pressed="${state.blitzOnly}">★ Glomb-Blitz (${MECHANISMS.filter(m=>m.blitz).length})</button>
  </div>`;
  TEIL_ORDER.forEach(t=>{
    const list = (groups[t]||[]).filter(m=> !state.blitzOnly || m.blitz);
    if(!list.length) return;
    html += `<div class="teil-group"><div class="teil-header">Teil ${t} <span class="teil-name">${TEIL_TITLES[t]}</span></div>`;
    list.forEach(m=>{
      html += `<button class="mech-link" data-id="${m.id}" aria-current="${state.activeId===m.id}">
        <span class="num">${m.num}</span>
        ${m.blitz?'<span class="star" title="Glomb-Blitz">★</span>':''}
        <span class="t">${m.title}</span>
      </button>`;
    });
    html += `</div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
  document.querySelectorAll('.mech-link').forEach(btn=>{
    btn.addEventListener('click', ()=>{ selectMechanism(btn.dataset.id); closeSidebarMobile(); });
  });
  document.getElementById('chipAll').addEventListener('click', ()=>{ state.blitzOnly=false; renderSidebar(); });
  document.getElementById('chipBlitz').addEventListener('click', ()=>{ state.blitzOnly=true; renderSidebar(); });
}

function renderWelcome(){
  let html = `<div class="welcome"><span class="kicker" style="font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:700;">Zur Benutzung</span>
  <h2 style="margin-top:6px;">Jeder Pfeil einzeln beschrieben</h2>
  <p class="lede">Dieses Kompendium enthält ausschließlich Mechanismen — nach dem Muster: welches Elektronenpaar / welche Bindung greift an welchem Zentrum an, wie lautet die Pfeilrichtung, was wird gebrochen, was wird geknüpft, welche Ladung entsteht wo? Wähle links einen Mechanismus und blättere unten mit „Weiter“ Pfeil für Pfeil durch die Elektronenverschiebung. Am Ende jedes Mechanismus stehen Querverbindungen zu anderen Warengruppen.</p>
  <div class="legend">
    <div class="item"><span class="swatch" style="background:var(--nucleophile)"></span> Nukleophil</div>
    <div class="item"><span class="swatch" style="background:var(--electrophile)"></span> Elektrophil</div>
    <div class="item"><span class="swatch" style="background:var(--radical)"></span> Radikal / Metallzentrum</div>
    <div class="item"><span class="swatch" style="background:var(--leaving)"></span> Abgangsgruppe</div>
    <div class="item"><span class="swatch" style="background:var(--accent)"></span> aktiver Pfeil dieses Schritts</div>
  </div>
  <h3 style="margin-top:28px;font-family:var(--sans);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);">★ Glomb-Blitz — zuerst abrufbereit haben</h3>
  <div class="grid">`;
  MECHANISMS.filter(m=>m.blitz).forEach(m=>{
    html += `<a data-id="${m.id}"><div class="tt">${m.num} · ${m.title}</div><div class="ss">Teil ${m.teil} — ${TEIL_TITLES[m.teil]}</div></a>`;
  });
  html += `</div></div>`;
  document.getElementById('stage').innerHTML = html;
  document.querySelectorAll('.welcome .grid a').forEach(a=>{
    a.addEventListener('click', ()=> selectMechanism(a.dataset.id));
  });
}

function selectMechanism(id){
  state.activeId = id;
  state.step = 0;
  renderSidebar();
  renderStage();
  document.getElementById('stage').scrollIntoView({behavior:'instant', block:'start'});
  window.scrollTo(0,0);
}

function renderStage(){
  const mech = MECHANISMS.find(m=>m.id===state.activeId);
  if(!mech){ renderWelcome(); return; }
  const totalSteps = mech.steps.length;
  const isResult = state.step >= totalSteps;
  const gmKeys = isResult ? [] : (mech.steps[state.step].gm || []);

  let html = `<div class="stage-inner">`;
  html += `<div class="mech-head">
    <div class="mech-tags">
      <span class="tag">Teil ${mech.teil} · ${TEIL_TITLES[mech.teil]}</span>
      ${mech.blitz?'<span class="tag blitz">★ Glomb-Blitz</span>':''}
    </div>
    <h2>${mech.num} · ${mech.title}</h2>
    <div class="zusammenhang">${mech.zusammenhang||''}</div>
  </div>`;

  html += `<div class="card diagram-card">
    <div class="diagram-toolbar">
      <span class="step-pill">${isResult ? '<b>Ergebnis</b>' : `Pfeil <b>${state.step+1}</b> / ${totalSteps}`}</span>
      <span>${gmKeys.map(gmChip).join(' ')}</span>
    </div>
    <div class="diagram-wrap">${renderMechSVG(mech, state.step, true)}</div>
    <div class="step-text${isResult?' is-result':''}">
      <span class="arrow-badge">${isResult?'Netto':'Pfeil '+(state.step+1)}</span>
      ${isResult ? (mech.netto||'') : mech.steps[state.step].text}
    </div>
    <div class="step-nav">
      <button class="step-btn" id="prevBtn" ${state.step===0?'disabled':''}>← Zurück</button>
      <div class="step-dots">`;
  for(let i=0;i<totalSteps;i++){
    html += `<button class="step-dot" data-i="${i}" aria-current="${state.step===i}" title="Pfeil ${i+1}"></button>`;
  }
  html += `<button class="step-dot is-result" data-i="${totalSteps}" aria-current="${state.step===totalSteps}" title="Ergebnis"></button>`;
  html += `</div>
      <button class="step-btn" id="nextBtn" ${state.step>=totalSteps?'disabled':''}>${isResult?'Fertig':'Weiter →'}</button>
      <span class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> zum Blättern</span>
    </div>
  </div>`;

  html += `<div class="recap"><h3>Alle Schritte im Überblick</h3><ul class="recap-list">`;
  mech.steps.forEach((s,i)=>{
    html += `<li data-i="${i}" class="${state.step===i?'active':''}">
      <span class="n">${i+1}</span>
      <span>${s.text}</span>
    </li>`;
  });
  html += `</ul></div>`;

  html += `<div class="endboxes">
    <div class="endbox netto"><h4>Netto / Ergebnis</h4>${mech.netto||'—'}</div>
    <div class="endbox quer"><h4>Querverbindung</h4>${mech.querverbindung||'—'}</div>
  </div>`;

  html += `</div>`;
  document.getElementById('stage').innerHTML = html;

  document.getElementById('prevBtn').addEventListener('click', ()=> setStep(state.step-1));
  document.getElementById('nextBtn').addEventListener('click', ()=> setStep(state.step+1));
  document.querySelectorAll('.step-dot').forEach(d=> d.addEventListener('click', ()=> setStep(parseInt(d.dataset.i,10))));
  document.querySelectorAll('.recap-list li').forEach(li=> li.addEventListener('click', ()=> setStep(parseInt(li.dataset.i,10))));
}

function setStep(i){
  const mech = MECHANISMS.find(m=>m.id===state.activeId);
  if(!mech) return;
  state.step = Math.max(0, Math.min(mech.steps.length, i));
  renderStage();
}

document.addEventListener('keydown', (e)=>{
  if(!state.activeId) return;
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'){ setStep(state.step+1); }
  if(e.key==='ArrowLeft'){ setStep(state.step-1); }
});

/* ---------- theme toggle ---------- */
function applyTheme(mode){
  const root = document.documentElement;
  if(mode==='dark'){ root.setAttribute('data-theme','dark'); }
  else if(mode==='light'){ root.setAttribute('data-theme','light'); }
  else { root.removeAttribute('data-theme'); }
  const isDark = mode==='dark' || (mode==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeToggle').setAttribute('aria-pressed', String(isDark));
  document.getElementById('themeKnob').textContent = isDark ? '☾' : '☀';
  document.getElementById('themeLabel').textContent = isDark ? 'Dunkel' : 'Hell';
  try{ localStorage.setItem('lmc-theme', mode); }catch(e){}
}
function initTheme(){
  let saved = 'system';
  try{ saved = localStorage.getItem('lmc-theme') || 'system'; }catch(e){}
  applyTheme(saved);
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme');
  const isDarkNow = current==='dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(isDarkNow ? 'light' : 'dark');
});

/* ---------- mobile sidebar ---------- */
document.getElementById('menuBtn').addEventListener('click', ()=>{
  const sb = document.getElementById('sidebar');
  const open = sb.classList.toggle('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded', String(open));
});
function closeSidebarMobile(){
  if(window.innerWidth<=900){ document.getElementById('sidebar').classList.remove('open'); }
}

/* ---------- boot ---------- */
initTheme();
renderSidebar();
renderWelcome();
</script>
</body>
</html>
